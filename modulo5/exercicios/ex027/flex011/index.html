<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box - Grow e Shrink</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            font-size: 1.5em;
            border: 1px solid rgba(0, 0, 0, 0.342);
            text-align: center;
            padding: 10px;
            flex-basis: 200px;
        }

        div#cxA {
            flex-shrink: 0;
            flex-grow: 0;
        }

        div#cxB {
            flex-shrink: 1;
            flex-grow: 2;
        }

        div#cxC {
            flex-shrink: 8;
            flex-grow: 2;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA"> A </div>
        <div class="item" id="cxB"> B </div>
        <div class="item" id="cxC"> C </div>
    </div>
</body>
</html>

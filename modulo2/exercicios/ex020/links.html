<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: rgb(65, 137, 204);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover{
            color: rgb(12, 22, 66);
            text-decoration: underline;
        }

        a:visited{
            color: black;
        }

        a:active{
            color: rgb(223, 167, 65);
        }

        .especial{
            background-color: rgb(231, 148, 148);
        }

        .especial::before{
            content: "=>";
            font-weight: 800;
            color: darkred;
        }

        .especial:hover::before{
            content: "[Clique!] ";
        }

        .especial::after{
            content: "<=";
            font-weight: 800;
            color: darkred;
        }

        .especial:hover::after{
            content: " [Clique!]";
        }
    </style>

</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório Github</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" target="_blank" class="especial">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com" target="_blank" class="especial">Site do CursoemVideo</a></li>
    </ul>
</body>
</html>

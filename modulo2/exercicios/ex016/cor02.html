<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>

    <style>
        *{ /*Configurações globais da CSSs*/
            height: 100%;
        }
        body{
            background-image: radial-gradient(circle, #B23422, #893B2F, #DE2002, #5E3630, #342523, #332C2B);
            color: #ffffff;
            background-attachment: fixed;
            text-shadow: 1px 2px 5px black;
        }
    </style>

</head>
<body>
    <h1> Testando gradientes </h1>
</body>
</html>

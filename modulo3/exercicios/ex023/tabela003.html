<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /*table {
            border-collapse: collapse;
            width: 300px;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }*/

        table.divisao {
            border: 0px solid white;
            width: 300px;
            height: 300px;
        }

        td {
            font-size: 3em;
            text-align: center;
        }

        .divisor {
            border-left: 2px solid black;
            border-bottom: 2px solid black;
        }

        .resto {
            text-decoration: underline;
        }
    </style>

</head>
<body>
    <h1>Mesclagem de Células</h1>

    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
            
        </tr>
        <tr>
            <td rowspan="3">D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            
            <td>K</td>
            <td>L</td>
        </tr>
    </table>

    <h1>Brincando com mesclagem de células:</h1>
    
    <h2>Estrutura de uma divisão</h2>

    <table class="divisao">
        <tr>
            <td>8</td>
            <td class="divisor">4</td>
        </tr>

        <tr>
            <td class="resto">0</td>
            <td>2</td>
        </tr>
    </table>
</body>
</html>

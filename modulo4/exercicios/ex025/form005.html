<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="idmas" value="M"><label for="idmas">Masculino</label>
            <input type="radio" name="sexo" id="idfem" value="F" checked><label for="idfem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="esbas" id="idesbas"><label for="idesbas">Basquete</label><br>
            <input type="checkbox" name="esfut" id="idesfut" checked><label for="idesfut">Futebol</label><br>
            <input type="checkbox" name="esvol" id="idesvol"><label for="idesvol">Vôlei</label><br>
            <input type="checkbox" name="estm" id="idestm" checked><label for="idestm">Tênis de Mesa</label><br>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>

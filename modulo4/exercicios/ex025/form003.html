<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="idnome">Nome</label>
            <input type="text" name="nome" id="idnome" required maxlength="30" placeholder="Nome completo" autocomplete="name">
        </p>
        <p>
            <label for="idmedia">Média</label>
            <input type="number" name="media" id="idmedia" min="0" max="10" required step="0.1" placeholder="0 a 10">
        </p>
        <p>
            <label for="idmes">Período Letivo</label>
            <input type="month" name="mes" id="idmes" value="2025-04">
        </p>
        <p>
            <label for="iddia">Dia da Prova</label>
            <input type="date" name="dia" id="iddia" value="2025-04-01">
        </p>
        <p>
            <label for="idhora">Horário da Prova</label>
            <input type="time" name="hora" id="idhora" value="09:40">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>

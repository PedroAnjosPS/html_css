<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="idest">Estado</label>
            <select name="estado" id="idest">
                <optgroup label="Região Sudeste">
                    <option value="SP">São Paulo</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                </optgroup>
                <optgroup label="Região Nordeste">
                    <option value="BA">Bahia</option>
                    <option value="PB">Paraíba</option>
                    <option value="AL">Alagoas</option>
                </optgroup>
                <optgroup label="Região Norte">
                    <option value="AM">Amazonas</option>
                    <option value="PA">Pará</option>
                    <option value="AC">Acre</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="idprof">Profissão</label>
            <input type="text" name="prof" id="idprof" list="idLstPro">
            <datalist id="idLstPro">
                <option>Padeiro</option>
                <option>Confeiteiro</option>
                <option>Pedreiro</option>
                <option>Uber</option> 
            </datalist>
        </p>

        <p>
            <label for="idmsg">Mensagem:</label><br>
            <textarea name="msg" id="idmsg" cols="30" rows="10"></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="idAno">Em que ano você nasceu?</label>
            <input type="number" name="ano" id="idAno" min="1900" value="2000" required oninput="calcIdade()">
        </p>

        <p>
            <label for="idIdade">Sua idade é:</label>
            <output name="idade" id="idIdade">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <script>
        function calcIdade(){
            let anoAtual = new Date().getFullYear();
            idIdade.innerHTML = Number(anoAtual) - Number(idAno.value);
        }
    </script>
</body>
</html>
